<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1e18">
<link rel="icon" href="data:,">
<title>soma</title>
<script type="importmap">
{
	"imports": {
		"three": "/vendor/three/three.module.js",
		"marked": "/vendor/marked/marked.esm.js"
	}
}
</script>
<link rel="stylesheet" href="/house.css">
</head>
<body>
<main id="stage">
	<div id="scene"></div>
	<div id="bubble" class="bubble" role="status" aria-live="polite" hidden><div id="bubble-text"></div></div>
	<div id="status" role="status">連線中斷，重新連線中…</div>
</main>
<form id="say">
	<textarea id="text" rows="1" placeholder="跟 soma 說…" enterkeyhint="send" aria-label="跟 soma 說"></textarea>
	<button type="submit">傳送</button>
</form>

<button id="debug-toggle" type="button" aria-expanded="false" aria-controls="debug" aria-label="Debug panel">⚙</button>
<section id="debug" hidden>
	<div class="grid" id="views"></div>
	<div class="grid" id="states"></div>
	<label class="row">speed <input id="tempo" type="range" min="0.5" max="2" step="0.05" value="1"> <output id="tempo-out">1.00×</output></label>
	<label class="row">mouth <input id="mouth" type="range" min="0" max="1" step="0.01" value="0"> <output id="mouth-out">0.00</output></label>
	<pre id="readout">frame time: waiting…</pre>
</section>

<script type="module" src="/page.js"></script>
</body>
</html>
