<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3e9dc">
<title>soma</title>
<style>
	* { box-sizing: border-box; }
	html, body { margin: 0; height: 100%; }
	body {
		display: flex;
		flex-direction: column;
		height: 100dvh;
		font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif;
		background: #fbf7f2;
		color: #2b2520;
	}
	header {
		display: flex;
		align-items: center;
		gap: 12px;
		padding: calc(8px + env(safe-area-inset-top)) 16px 8px;
		background: #f3e9dc;
		border-bottom: 1px solid #e2d5c4;
	}
	header img { width: 64px; height: 64px; flex: none; }
	#status { font-size: 14px; color: #7a6a58; }
	#log {
		flex: 1;
		overflow-y: auto;
		padding: 12px;
		display: flex;
		flex-direction: column;
		gap: 8px;
	}
	.msg {
		max-width: 85%;
		padding: 8px 12px;
		border-radius: 14px;
		white-space: pre-wrap;
		overflow-wrap: anywhere;
	}
	.me { align-self: flex-end; background: #d9ecd2; }
	.me.pending { opacity: 0.6; }
	.soma { align-self: flex-start; background: #fff; border: 1px solid #e2d5c4; }
	.notice { align-self: stretch; max-width: none; background: #fff6d8; border: 1px solid #ecd9a0; font-size: 15px; }
	.failure { align-self: stretch; max-width: none; background: #fde4e1; border: 1px solid #f0b9b2; font-size: 15px; }
	.quiet { opacity: 0.7; }
	form {
		display: flex;
		gap: 8px;
		padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
		background: #f3e9dc;
		border-top: 1px solid #e2d5c4;
	}
	textarea {
		flex: 1;
		min-width: 0;
		resize: none;
		font: inherit;
		padding: 8px 10px;
		border: 1px solid #cdbda9;
		border-radius: 10px;
		max-height: 30dvh;
	}
	button {
		font: inherit;
		padding: 0 16px;
		border: 0;
		border-radius: 10px;
		background: #7a6a58;
		color: #fff;
	}
</style>
</head>
<body>
<header>
	<img src="/character.svg" alt="soma">
	<div>
		<div><strong>soma</strong></div>
		<div id="status">連線中…</div>
	</div>
</header>
<main id="log" aria-live="polite"></main>
<form id="form">
	<textarea id="text" rows="1" placeholder="跟 soma 說…" enterkeyhint="send"></textarea>
	<button type="submit">傳送</button>
</form>
<script>
	"use strict";
	const log = document.getElementById("log");
	const statusLine = document.getElementById("status");
	const form = document.getElementById("form");
	const text = document.getElementById("text");
	// Sent and not yet admitted, by id: resent with the same id after a reconnect, so the core admits each once.
	const pending = new Map();
	let socket;
	let connected = false;
	let running = false;
	let retryMs = 500;

	// crypto.randomUUID needs a secure context, and the page is plain HTTP over the tailnet.
	const newId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");

	const add = (className, content) => {
		const atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
		const el = document.createElement("div");
		el.className = `msg ${className}`;
		el.textContent = content;
		log.append(el);
		if (atBottom || className.startsWith("me")) el.scrollIntoView({ block: "end" });
		return el;
	};
	const showStatus = () => {
		statusLine.textContent = !connected ? "連線中斷，重新連線中…" : running ? "思考中…" : "在線";
	};
	// A push meant for this page rings by marking the tab until the human comes back to it.
	const ring = () => {
		if (document.visibilityState !== "visible") document.title = "● soma";
	};
	document.addEventListener("visibilitychange", () => {
		if (document.visibilityState === "visible") document.title = "soma";
	});

	const send = (id, content) => {
		if (connected) socket.send(JSON.stringify({ type: "input", id, text: content }));
	};

	const receive = (message) => {
		if (message.type === "run") {
			running = message.state === "working";
			showStatus();
		} else if (message.type === "accepted") {
			const sent = pending.get(message.id);
			pending.delete(message.id);
			sent?.el.classList.remove("pending");
		} else if (message.type === "answer") {
			add("soma", message.text);
			ring();
		} else if (message.type === "notice") {
			add(`notice${message.loud ? "" : " quiet"}`, `[${message.kind === "question" ? "問題" : "通知"}] ${message.text}`);
			if (message.loud) ring();
		} else if (message.type === "failure") {
			if (message.id !== undefined) pending.delete(message.id);
			add(`failure${message.loud ? "" : " quiet"}`, `[失敗] ${message.text}`);
			if (message.loud) ring();
		} else if (message.type === "error") {
			add("failure", `[錯誤] ${message.text}`);
		}
	};

	const connect = () => {
		socket = new WebSocket(`ws://${location.host}/socket`);
		socket.onopen = () => {
			connected = true;
			retryMs = 500;
			showStatus();
			for (const [id, sent] of pending) send(id, sent.content);
		};
		socket.onmessage = (event) => receive(JSON.parse(event.data));
		socket.onclose = () => {
			connected = false;
			showStatus();
			setTimeout(connect, retryMs);
			retryMs = Math.min(retryMs * 2, 10000);
		};
	};

	form.addEventListener("submit", (event) => {
		event.preventDefault();
		const content = text.value.trim();
		if (content === "") return;
		const id = newId();
		pending.set(id, { content, el: add("me pending", content) });
		send(id, content);
		text.value = "";
		text.style.height = "";
	});
	// Enter sends on a keyboard; Shift+Enter, and a phone's IME composing, keep the line.
	text.addEventListener("keydown", (event) => {
		if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
			event.preventDefault();
			form.requestSubmit();
		}
	});
	text.addEventListener("input", () => {
		text.style.height = "";
		text.style.height = `${text.scrollHeight}px`;
	});

	connect();
</script>
</body>
</html>
